name: Import FEVerse into RobuBubble

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-feverse.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RobuBubble
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download and extract FEVerse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/feverse
          curl -fL --retry 3 "https://github.com/MelonsStuff/FEVerse/archive/refs/heads/main.zip" -o /tmp/feverse.zip
          unzip -q /tmp/feverse.zip -d /tmp/feverse
          mkdir -p FEVerse
          cp -a /tmp/feverse/FEVerse-main/. FEVerse/
          rm -rf FEVerse/.git

      - name: Commit imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FEVerse/
          if git diff --cached --quiet; then
            echo "No FEVerse file changes to import."
            exit 0
          fi
          git commit -m "Import FEVerse source repository"
          git push origin HEAD:main
